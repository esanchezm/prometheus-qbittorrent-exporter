name: Docker

on:
  push:
    # Every branch gets an image tagged with its name; bot branches are skipped.
    branches: [ '**', '!renovate/**', '!dependabot/**' ]
    tags: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker hub meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # `latest` is only added for release (version tag) builds, never for branches.
          flavor: |
            latest=auto
          tags: |
            type=pep440,prefix=v,pattern={{version}}
            type=ref,event=branch
            type=sha
          images: ${{ github.repository_owner }}/prometheus-qbittorrent-exporter

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push docker to DockerHub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64,linux/386
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GHCR Docker meta
        id: metaghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # `latest` is only added for release (version tag) builds, never for branches.
          flavor: |
            latest=auto
          tags: |
            type=pep440,prefix=v,pattern={{version}}
            type=ref,event=branch
            type=sha
          images: ghcr.io/${{ github.repository_owner }}/prometheus-qbittorrent-exporter

      - name: Login to Github Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker to Github Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64,linux/386
          tags: ${{ steps.metaghcr.outputs.tags }}
          labels: ${{ steps.metaghcr.outputs.labels }}
