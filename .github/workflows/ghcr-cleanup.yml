name: GHCR cleanup

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would be deleted'
        type: boolean
        default: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old commit images and untagged versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: prometheus-qbittorrent-exporter
          # Per-commit tags pile up on every push; branch and release tags are kept.
          delete-tags: sha-*
          exclude-tags: latest,v*
          delete-untagged: true
          older-than: 14 days
          # Manual runs default to a dry run; scheduled runs delete for real.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
